# Optional systemd sandboxing for Vikunja.
#
# These directives change which files the service can see and which credentials
# it holds. They are not enabled by default because Vikunja's data paths are
# configurable: masking a path your config actually uses either breaks startup
# or, worse, leaves an empty writable directory in its place, so Vikunja comes
# up with no data and loses whatever it writes on restart.
#
# Before enabling, check that none of the following live under /home, /root,
# /tmp or /var/tmp:
#   - database.path                              (the SQLite file)
#   - files.basepath                             (attachments)
#   - database.sslcert / sslkey / sslrootcert    (database TLS)
#
# Postgres over TLS needs one extra step. /root becomes unreadable, so libpq's
# probe for its default client certificate at ~/.postgresql/postgresql.crt fails
# with EACCES rather than ENOENT, and libpq aborts the connection - even if you
# have no client certificate at all. With sslmode=require or stricter, set
# database.sslcert to an explicit path to skip the probe; the path may point at a
# file that does not exist. With sslmode=prefer, libpq instead falls back to an
# unencrypted connection without reporting anything.
#
# The capability reset also drops CAP_DAC_OVERRIDE, so every path Vikunja needs
# must be readable by root on its own permissions - files owned by another user
# with mode 0600 will no longer open. If you bind to a port below 1024, add the
# CAP_NET_BIND_SERVICE lines below back after the reset.
#
# To enable:
#   install -Dm644 /usr/share/doc/vikunja/hardening.conf \
#     /etc/systemd/system/vikunja.service.d/hardening.conf
#   systemctl daemon-reload && systemctl restart vikunja
#
# To undo, delete that file and reload again.

[Service]
PrivateTmp=yes
ProtectHome=yes
UMask=0077

CapabilityBoundingSet=
AmbientCapabilities=
#CapabilityBoundingSet=CAP_NET_BIND_SERVICE
#AmbientCapabilities=CAP_NET_BIND_SERVICE
