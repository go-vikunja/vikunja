name: Set review turn labels

on:
  # pull_request_review runs get a read-only token on fork PRs, so reviews
  # arrive via workflow_run from review-turn-trigger.yml. Cron is the fallback.
  workflow_run:
    workflows: [Review turn trigger]
    types: [completed]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  pull_request_target:
    types: [opened, reopened, ready_for_review, converted_to_draft, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  reconcile:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    concurrency:
      group: review-turn-${{ github.event.pull_request.number || github.event.issue.number || 'all' }}
      cancel-in-progress: false
    steps:
      - name: Checkout (script only, base branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts/review-turn.mjs
          sparse-checkout-cone-mode: false

      - name: Reconcile turn labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          ANSWERED_NOW: ${{ github.event_name == 'pull_request_target' && github.event.action == 'synchronize' && 'true' || 'false' }}
          APPLY: 'true'
        run: node .github/scripts/review-turn.mjs
