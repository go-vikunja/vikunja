name: Preview

on:
  # pull_request_target gives write access to GHCR even for PRs from forks.
  # The workflow definition always comes from the base ref, so a fork cannot change
  # these steps. What a fork *does* control is the Dockerfile and everything it RUNs,
  # which executes on the runner inside buildkit. It never sees GITHUB_TOKEN (not passed
  # as a build-arg), but it does get network egress from a job holding packages: write.
  # The `preview` environment below gates that behind maintainer approval.
  pull_request_target:

jobs:
  docker:
    runs-on: ubuntu-latest
    # Fork pull_request_target runs skip the usual outside-contributor approval prompt.
    # `preview-fork` carries required reviewers to put that gate back; `preview-trusted`
    # has no protection rules so same-repo PRs still build without a click.
    environment:
      name: ${{ github.event.pull_request.head.repo.full_name == github.repository && 'preview-trusted' || 'preview-fork' }}
      url: https://pr-${{ github.event.pull_request.number }}.preview.vikunja.dev
    permissions:
      packages: write
      contents: read
      pull-requests: write
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          large-packages: false
          docker-images: false
          swap-storage: false
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR's commit SHA is not reachable in the base repository, so fetch the
          # fork's ref explicitly. checkout >= v7 refuses this under pull_request_target
          # unless opted in; see the threat model at the top of this file.
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          allow-unsafe-pr-checkout: true
      - name: Git describe
        id: ghd
        uses: proudust/gh-describe@80412be8ce0e77d8afba6b340e34790bc772aa45 # v2.2.0
        with:
          # On pull_request_target, github.sha is the base branch head, so the
          # default ref would describe main instead of the PR commit.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: latest
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        env:
          # Under pull_request_target, github.sha is the base branch tip; tag with the PR head sha instead.
          DOCKER_METADATA_PR_HEAD_SHA: 'true'
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}
          tags: |
            type=ref,event=pr
            type=sha,format=long
      - name: Build and push PR image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            RELEASE_VERSION=${{ steps.ghd.outputs.describe }}
      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DOCKER_META_TAGS: ${{ steps.meta.outputs.tags }}
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const base = 'preview.vikunja.dev';
            const image = `ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}`;
            const marker = '<!-- vikunja-preview-comment -->';

            // Extract the SHA tag from docker meta output (the actual tag pushed to GHCR)
            const metaTags = process.env.DOCKER_META_TAGS.split('\n').map(t => t.trim()).filter(Boolean);
            const shaImageRef = metaTags.find(t => t.includes(':sha-'));
            const shaTag = shaImageRef ? shaImageRef.split(':').pop() : null;
            const shortSha = shaTag ? shaTag.replace('sha-', '').substring(0, 7) : context.payload.pull_request.head.sha.substring(0, 7);

            const prTag = `pr-${prNumber}`;
            const newShaRow = shaTag
              ? `| https://${shaTag}.${base} | \`${image}:${shaTag}\` | \`${shortSha}\` |`
              : '';

            // Collect previous SHA rows from existing comment
            let previousShaRows = [];
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              previousShaRows = existing.body
                .split('\n')
                .filter(l => l.includes(`sha-`) && l.includes(`.${base}`));
            }

            // Remove duplicate if this SHA was already recorded
            if (shaTag) {
              previousShaRows = previousShaRows.filter(r => !r.includes(shaTag));
            }

            const allShaRows = [newShaRow, ...previousShaRows].filter(Boolean).join('\n');

            const body = [
              marker,
              `### Preview Deployment`,
              ``,
              `Preview deployments for this PR are available at:`,
              ``,
              `| URL | Tag | Commit |`,
              `| --- | --- | --- |`,
              `| https://${prTag}.${base} | \`${image}:${prTag}\` | latest |`,
              allShaRows,
              ``,
              `The preview environment will start automatically on first visit. Subsequent pushes to this PR will update the \`${prTag}\` image — the preview picks up the new version on restart. The per-commit URLs point to a specific version and will not change.`,
              ``,
              `<details>`,
              `<summary>Run locally with Docker</summary>`,
              ``,
              '```bash',
              `docker pull ${image}:${prTag}`,
              `docker run -p 3456:3456 ${image}:${prTag}`,
              '```',
              `</details>`,
              ``,
              `_Last updated for commit ${shortSha}_`,
            ].join('\n');

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }
